services:
  yomiko:
    image: kechako/yomiko:latest
    environment:
      YOMIKO_TOKEN: ${YOMIKO_TOKEN}
    volumes:
      - type: bind
        source: "${CREDENTIALS_FILE}"
        target: /etc/yomiko/credentials.json
        read_only: true
      - type: bind
        source: "${DATABASE_PATH}"
        target: /usr/var/lib/yomiko/yomiko.db
        read_only: false
    build:
      context: "."
      target: "runtime"
      args:
        GO_VERSION: 1.25.4
      platforms:
        - "linux/amd64"
        - "linux/arm64"
